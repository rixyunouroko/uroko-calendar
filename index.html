<style>
body {
  font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
  background: #f5f0e6;
  margin: 0;
  padding: 0;
}

#app {
  max-width: 900px;
  margin: auto;
  padding: 20px;
}

.title {
  text-align: center;
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 4px;
}

.subtitle {
  text-align: center;
  font-size: 1.1rem;
  color: #555;
  margin-bottom: 20px;
}

.section {
  background: #fff;
  padding: 20px;
  border-radius: 16px;
  margin-bottom: 20px;
  box-shadow: 0 4px 10px rgba(0,0,0,0.05);
}

.section h2 {
  font-size: 1.2rem;
  margin-bottom: 10px;
}

.tag {
  display: inline-block;
  font-size: 0.75rem;
  background: #efe1c7;
  color: #6b5a3c;
  padding: 4px 10px;
  border-radius: 999px;
  margin-bottom: 10px;
}

.block {
  margin-top: 12px;
}

.block h3 {
  font-size: 0.95rem;
  color: #6b5a3c;
  margin-bottom: 4px;
}

.card {
  background: #fffaf0;
  padding: 14px;
  border-radius: 12px;
  line-height: 1.7;
}

.card.back {
  background: #ffecec;
}

.wave {
  background: #f0f6ff;
}

#birthdayResult {
  margin-top: 15px;
  background: #fffceb;
  padding: 15px;
  border-radius: 12px;
  line-height: 1.7;
}

.mini-info {
  display: flex;
  gap: 18px;
}

.mini-col {
  text-align: center;
  font-size: 0.85rem;
}
.icon-img {
  width: 40px;
  height: 40px;
  object-fit: contain;
}
.mini-title {
  font-weight: bold;
  font-size: 1rem;   /* ← 音・紋章名 */
}

.mini-text {
  font-size: 0.75rem; /* ← テーマ一言 */
  opacity: 0.85;
}
/* ここまで既存のCSS */

.title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.title-row h2 {
  margin: 0;
}

@media (max-width: 600px) {
  .title-row {
    flex-direction: row;   /* ← column を row に */
    align-items: center;
    gap: 12px;
  }
}
.wave-description{
  margin: 0;
  font-size: 1rem;
  line-height: 1.7;
}

.wave-day{
  margin-top: 6px;
  font-size: 14px;
  text-align: right;
  opacity: 0.7;
}
/* 誕生日入力エリア */
.birthday-block {
  margin-top: 10px;
}

.birthday-label {
  font-size: 0.9rem;
  color: #555;
  display: block;
  margin-bottom: 6px;
}

.birthday-row {
  display: flex;
  gap: 8px;
  align-items: center;
}

.birthday-input {
  flex: 1;
  padding: 10px 12px;
  font-size: 1rem;
  border-radius: 999px;
  border: 1px solid #ddd;
  background: #fff;
  box-sizing: border-box;
}

.birthday-button {
  padding: 10px 16px;
  font-size: 0.9rem;
  border-radius: 999px;
  border: none;
  background: #6b5a3c;
  color: #fff;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
}

/* スマホで縦並び */
@media (max-width: 600px) {
  .birthday-row {
    flex-direction: column;
    align-items: stretch;
  }
  .birthday-button {
    width: 100%;
    text-align: center;
  }
}
.mini-title {
  font-weight: bold;
  font-size: 1rem;
  display: flex;
  flex-direction: column;   /* ← 縦並びにする */
  align-items: center;      /* ← 中央寄せ */
  gap: 4px;                 /* ← アイコンと文字の間のスキマ */
}

.icon-tone,
.icon-glyph,
.icon-wave-glyph {
  width: 40px;            /* 好きなサイズに調整してOK */
  height: 40px;
  object-fit: contain;
}

.wave-header {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 6px;
  font-weight: bold;
}
.more-btn {
  margin-top: 8px;
  background: none;
  border: none;
  color: #6b5a3c;
  font-size: 0.85rem;
  cursor: pointer;
  padding: 0;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.more-btn::before {
  content: "＋";
  font-weight: bold;
}

.more-btn.is-open::before {
  content: "－";
}

.extra-detail {
  display: none;
  margin-top: 8px;
  font-size: 0.85rem;
  color: #555;
  border-top: 1px dashed #e0d4bf;
  padding-top: 6px;
  line-height: 1.7;
}

<body>
<div id="app">

  <h1 class="title">Uroko Calendar</h1>
<p class="subtitle" id="todayDate"></p>

    <button class="birthday-button" onclick="resetToToday()">今日に戻る</button>
  </div>

<!-- ツォルキン暦 -->
<div class="section">
  <h2>ツォルキン暦</h2>

    <div class="title-row">
    <span class="tag">本日の音と紋章</span>

    <div class="mini-info">
      <div class="mini-col">
        <div class="mini-title">
          <img id="tToneIcon" class="icon-tone" alt="">
          <span id="tToneName"></span>
        </div>
        <div class="mini-text" id="tToneTheme"></div>
      </div>
      <div class="mini-col">
        <div class="mini-title">
          <img id="tGlyphIcon" class="icon-glyph" alt="">
          <span id="tGlyphName"></span>
        </div>
        <div class="mini-text" id="tGlyphTheme"></div>
      </div>
    </div>
  </div>

  <div class="block">
    <h3>今日のテーマ（表）</h3>
    <div class="card" id="tFront"></div>
  </div>

  <div class="block">
    <h3>本能・無意識（裏）</h3>
    <div class="card back" id="tBack"></div>
  </div>

    <div class="block">
    <h3>この13日間のテーマ（ウェイブスペル）</h3>
    <div class="card wave">
      <div class="wave-header">
        <img id="tWaveGlyphIcon" class="icon-wave-glyph" alt="">
        <span id="tWave"></span>
      </div>
      <div id="tWaveInfo"></div>
    </div>
  </div>
</div> 

<!-- ウロコ暦 -->
<div class="section">
  <h2>ウロコ暦</h2>

    <div class="title-row">
    <span class="tag">本日の音と紋章</span>
    <div class="mini-info">
      <div class="mini-col">
        <div class="mini-title">
          <img id="uToneIcon" class="icon-tone" alt="">
          <span id="uToneName"></span>
        </div>
        <div class="mini-text" id="uToneTheme"></div>
      </div>
      <div class="mini-col">
        <div class="mini-title">
          <img id="uGlyphIcon" class="icon-glyph" alt="">
          <span id="uGlyphName"></span>
        </div>
        <div class="mini-text" id="uGlyphTheme"></div>
      </div>
    </div>
  </div>

  <div class="block">
    <h3>今日のテーマ（表）</h3>
    <div class="card" id="uFront"></div>
  </div>

  <div class="block">
    <h3>本能・無意識（裏）</h3>
    <div class="card back" id="uBack"></div>
  </div>

    <div class="block">
    <h3>この13日間のテーマ（ウロコ暦）</h3>
    <div class="card wave">
      <div class="wave-header">
        <img id="uWaveGlyphIcon" class="icon-wave-glyph" alt="">
        <span id="uWave"></span>
      </div>
      <div id="uWaveInfo"></div>
    </div>
  </div>
</div>

<!-- 解説 -->
<div class="section">
  <h2>音・紋章・ツォルキン暦とは</h2>
  <p>
    マヤ暦（ツォルキン）は「13の音 × 20の紋章」で260日を巡る暦です。<br>
    音はその日のリズム、紋章はテーマや性質を表します。
  </p>
  <p>
    表は「外で動きやすい流れ」、<br>
    裏は「本能や無意識で出やすい動き」。
  </p>
  <p>
    両方あわせて読むことで、その日の全体像が見えてきます。
  </p>
</div>

<!-- 誕生日検索 -->
<div class="section">
  <h2>誕生日から調べる（ツォルキン）</h2>

  <div class="birthday-block">
    <label for="bInput" class="birthday-label">誕生日をえらんでください</label>
    <div class="birthday-row">
      <input type="date" id="bInput" class="birthday-input">
      <button class="birthday-button" onclick="searchBirthday()">検索</button>
    </div>
  </div>

  <div id="birthdayResult"></div>
</div>

/* ===== サイクル計算 ===== */
function calcCycle(date, startDate, startTone, startGlyph) {
  const diffDays = Math.floor((date - startDate) / 86400000);
  const day = ((diffDays % 260) + 260) % 260;

  return {
    tone: ((startTone - 1 + day) % 13) + 1,
    glyph: ((startGlyph - 1 + day) % 20) + 1,
    cycleDay: (day % 13) + 1
  };
}
function calcKin(startDate, targetDate) {
  const diff = Math.floor((targetDate - startDate) / 86400000);
  return ((diff % 260) + 260) % 260;
}

// ★ ツォルキン 13日間（ウェイブスペル）用 正式版
function calcWaveStartGlyph(startGlyph, diffDays) {
  const cycleDay = ((diffDays % 13) + 13) % 13;
  const waveIndex = Math.floor((((diffDays - cycleDay) % 260) + 260) % 260 / 13);
  return ((startGlyph - 1 + waveIndex) % 20) + 1;
}

// ★ ウロコ暦 13日間（ウェイブスペル）
function calcUrokoWaveGlyph(startGlyph, diffDays) {
  const cycleDay = ((diffDays % 13) + 13) % 13;
  const waveIndex = Math.floor((((diffDays - cycleDay) % 260) + 260) % 260 / 13);
  return ((startGlyph - 1 + waveIndex) % 20) + 1;
}

function searchBirthday() {
  const input = document.getElementById("bInput");
  const resultEl = document.getElementById("birthdayResult");
  if (!input || !resultEl) return;

  const v = input.value;
  if (!v) {
    resultEl.textContent = "誕生日をえらんでください。";
    return;
  }

  const d = new Date(v);
  if (isNaN(d)) {
    resultEl.textContent = "正しい日付を入力してください。";
    return;
  }

  const date = new Date(d.getFullYear(), d.getMonth(), d.getDate());

  // KIN番号（1〜260）
  const kinIndex = calcKin(t_startDate, date); // 0〜259
  const kinNumber = kinIndex + 1;

  // その日の「音」と「紋章」
  const t = calcCycle(date, t_startDate, t_startTone, t_startGlyph);
  const glyphName = glyphNames[t.glyph - 1];      // 紋章名
  const toneNum   = t.tone;                       // 1〜13
  const toneName  = toneNames[toneNum - 1];       // 「音1」みたいな名前

  const kinText     = kinBrief[kinNumber] || "";
  const glyphDetail = (glyphInfo[glyphName] || "").trim();
  const toneDetail  = (toneInfo[String(toneNum)] || "").trim();

  const yyyy = date.getFullYear();
  const mm   = String(date.getMonth() + 1).padStart(2, "0");
  const dd   = String(date.getDate()).padStart(2, "0");

  resultEl.innerHTML = `
    <h3>${yyyy}年${mm}月${dd}日 生まれ</h3>

    <p>
      <strong>KIN${kinNumber}</strong><br>
      音${toneNum}（${toneName}） × ${glyphName}
    </p>

    ${kinText ? `<p>${kinText}</p>` : ""}

    <hr>

    ${
      toneDetail
        ? `
        <h4>あなたの「音${toneNum}」について</h4>
        <p style="white-space: pre-line;">
          ${toneDetail}
        </p>
        <hr>
        `
        : ""
    }

    ${
      glyphDetail
        ? `
        <h4>あなたの紋章「${glyphName}」について</h4>
        <p style="white-space: pre-line;">
          ${glyphDetail}
        </p>
        `
        : ""
    }
  `;
}
